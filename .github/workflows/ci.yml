name: CI
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, develop]

env:
  IMAGE: ghcr.io/${{ github.repository }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a publish on main; only superseded PR runs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # -----------------------------------------------------------------
  # Lint on every pull request and on main
  # -----------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          # No Python project here: uv only runs mbake and bin/roman.py.
          enable-cache: false

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Install lint tools
        # shellcheck is preinstalled on the runner; these are not. The bin/
        # scripts skip a missing tool with a message instead of failing, so
        # without this step the lint job would pass while checking nothing.
        # Homebrew is preinstalled on ubuntu-24.04 but not on PATH.
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install hadolint dockerfmt shfmt shellharden
          echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"

      - name: Install
        run: make install

      - name: Lint
        run: make lint

  # -----------------------------------------------------------------
  # Build per-arch Docker images natively (PRs against main, pushes to main)
  # -----------------------------------------------------------------
  build:
    name: Build Image (${{ matrix.arch }})
    if: |
      github.ref_name == 'main' && github.event_name == 'push' ||
      github.base_ref == 'main'
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Load .env
        run: |
          set -a
          source .env
          {
            echo "BASE_VERSION=$BASE_VERSION"
            echo "VERSION=$VERSION"
            echo "ARCH_TAGS=${IMAGE}:${VERSION}-${{ matrix.arch }}"
          } >> "$GITHUB_ENV"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if image exists in GHCR
        id: check_image
        # Only on the promotion path; every PR event rebuilds the candidate
        if: github.event_name == 'push'
        run: |
          if docker manifest inspect ${{ env.ARCH_TAGS }} > /dev/null 2>&1; then
            echo "image_exists=true" >> "$GITHUB_OUTPUT"
            echo "Image found!"
          else
            echo "Image not found."
          fi

      - name: Build and push
        if: steps.check_image.outputs.image_exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: true
          build-args: |
            BASE_VERSION=${{ env.BASE_VERSION }}
            VERSION=${{ env.VERSION }}
          tags: ${{ env.ARCH_TAGS }}

      - name: Smoke test
        # The buildx builder pushed straight to the registry, so pull it back.
        run: |
          docker pull "$ARCH_TAGS"
          bin/test-image.sh "$ARCH_TAGS"

  # ---------------------------------------------------------------------------
  # Create multi-arch manifest and publish
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Load .env
        run: |
          set -a
          source .env
          echo "BASE_VERSION=$BASE_VERSION" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Create and push manifest
        run: |
          TAG_ARGS=("-t" "${IMAGE}:${VERSION}" "-t" "${IMAGE}:latest")

          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.title=python-debian" \
            --annotation "index:org.opencontainers.image.description=Python base image with a PUID/PGID remapped user" \
            --annotation "index:org.opencontainers.image.version=${VERSION}" \
            --annotation "index:org.opencontainers.image.revision=${{ github.sha }}" \
            --annotation "index:org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --annotation "index:org.opencontainers.image.authors=AJ Slater <aj@slater.net>" \
            --annotation "index:org.opencontainers.image.source=https://github.com/ajslater/python-debian" \
            --annotation "index:org.opencontainers.image.licenses=GPL-3.0-only" \
            "${TAG_ARGS[@]}" \
            "${IMAGE}:${VERSION}-amd64" \
            "${IMAGE}:${VERSION}-arm64"
